<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ if .IsHome }}{{ .Site.Title }}{{ else }}{{ .Title }} | {{ .Site.Title }}{{ end }}</title>
<meta name="description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<link rel="canonical" href="{{ .Permalink }}">
{{ if not hugo.IsProduction }}<meta name="robots" content="noindex, nofollow">{{ else }}<meta name="robots" content="index, follow">{{ end }}
<meta property="og:title" content="{{ .Title }}">
<meta property="og:description" content="{{ with .Description }}{{ . }}{{ else }}{{ .Site.Params.description }}{{ end }}">
<meta property="og:url" content="{{ .Permalink }}">
<meta property="og:type" content="website">
<link rel="stylesheet" href="/css/site.css">
</head>
<body>
<header class="site-header"><a class="brand" href="/">{{ .Site.Title }}</a><nav><a href="/">Service</a><a href="/guides/">Guides</a><a href="mailto:{{ .Site.Params.email }}?subject={{ .Site.Title | urlquery }}">Contact</a></nav></header>
<main>{{ block "main" . }}{{ end }}</main>
<footer class="site-footer"><p>Remote help for one device at a time. Source marker: <strong>{{ .Site.Params.source }}</strong></p><p><a href="mailto:{{ .Site.Params.email }}">{{ .Site.Params.email }}</a> · <a href="/sitemap.xml">Sitemap</a></p></footer>
</body>
</html>
